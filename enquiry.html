<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin's Cafe - Enquiries</title>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="images/coffee logo.jpg" alt="Kevin's Cafe Logo" width="120">
        </a>
        <h1>Kevin's Cafe</h1>
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Menu</a></li>
                <li><a href="enquiry.html">Enquiries</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        
        <section>
            <h2>General Enquiry Form</h2>
            <p>Have a question about catering or table bookings? Fill out the form below and we will get back to you!</p>

            <form action="#" method="post">
                
                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" required placeholder="e.g. Kevin Dlamini">
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required placeholder="e.g. name@example.com">
                </p>

                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="e.g. 0817837543">
                </p>

                <p>
                    <label for="enquiry_type">Type of Enquiry:</label><br>
                    <select id="enquiry_type" name="enquiry_type">
                        <option value="general">General Question</option>
                        <option value="catering">Catering / Event Request</option>
                        <option value="booking">Table Reservation</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" required placeholder="Write your message here..."></textarea>
                </p>

                <p>
                    <button type="submit">Submit Enquiry</button>
                    <button type="reset">Clear Form</button>
                </p>

            </form>
        </section>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Kevin's Cafe. ST10514675.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiries and Bookings | Kevin's Cafe Springs</title>
    <meta name="description" content="Send an enquiry to Kevin's Cafe about catering, table reservations or feedback. Fill in our form and we will get back to you.">
    <meta name="keywords" content="cafe catering Springs, table reservation, cafe enquiry, event catering">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a href="index.html">
            <img src="images/kevins-cafe-logo.jpg" alt="Kevin's Cafe logo showing a takeaway coffee cup" width="120">
        </a>
        <h1>Kevin's Cafe</h1>
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Menu</a></li>
                <li><a href="enquiry.html">Enquiries</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        
        <section>
            <h2>General Enquiry Form</h2>
            <p>Have a question about catering or table bookings? Fill out the form below and we will get back to you!</p>

            <form id="enquiryForm" action="#" method="post" novalidate>
                
                <p>
                    <label for="fullname">Full Name:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. Kevin Dlamini">
                    <span class="error" id="fullname_error"></span>
                </p>

                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" placeholder="e.g. name@example.com">
                    <span class="error" id="email_error"></span>
                </p>

                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="e.g. 0817837543">
                    <span class="error" id="phone_error"></span>
                </p>

                <p>
                    <label for="enquiry_type">Type of Enquiry:</label><br>
                    <select id="enquiry_type" name="enquiry_type">
                        <option value="general">General Question</option>
                        <option value="catering">Catering / Event Request</option>
                        <option value="booking">Table Reservation</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </p>

                <p>
                    <label for="guests">Number of Guests (catering and bookings only):</label><br>
                    <input type="number" id="guests" name="guests" min="1" placeholder="e.g. 20">
                    <span class="error" id="guests_error"></span>
                </p>

                <p>
                    <label for="event_date">Preferred Date (catering and bookings only):</label><br>
                    <input type="date" id="event_date" name="event_date">
                    <span class="error" id="event_date_error"></span>
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..."></textarea>
                    <span class="error" id="message_error"></span>
                </p>

                <p>
                    <button type="submit">Submit Enquiry</button>
                    <button type="reset">Clear Form</button>
                </p>

            </form>

            
            <div id="enquiryResult" class="form-result" aria-live="polite" hidden>
                <h3>Thank you for your enquiry</h3>
                <p id="enquiryMessage"></p>
            </div>
        </section>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Kevin's Cafe. ST10514675.</p>
    </footer>

    <script src="js/enquiry.js"></script>
</body>
</html>
